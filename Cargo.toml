[package]
publish = false
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = { version = "1.0" }
base64 = { version = "0.23" }
chrono = { version = "0.4" }
clap = { version = "4.5", features = ["derive"] }
crossbeam = { version = "0.8" }
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem"] }
serde = { version = "1.0", features = ["derive"] }
dotenvy = { version = "0.15" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_from_env = { version = "1.0" }
thiserror = { version = "2.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = { version = "2.5" }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3" }
rand = { version = "0.10" }
tokio-util = { version = "0.7" }
rust_decimal = { version = "1.43" }

[dev-dependencies]
flate2 = { version = "1.1" }
tempfile = { version = "3.27" }
wiremock = { version = "0.6" }

[build-dependencies]
ergo-sbe = { version = "=0.1.39" }
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = { version = "0.9" }
