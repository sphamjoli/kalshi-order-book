[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable. Reached only through the build-time YAML
  # parser that reads this repository's own schema files.
  "RUSTSEC-2024-0449",
]

[licenses]
confidence-threshold = 0.9
# Our own crates are proprietary and never published; skip them, check only third parties.
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "PostgreSQL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path, not a published version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
